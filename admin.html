<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnergyIQ - Admin Simulator</title>
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/en/3/3a/Lovely_Professional_University_logo.png">
  <link rel="stylesheet" href="css/style.css?v=15">
  <link rel="stylesheet" href="css/admin.css?v=15">
</head>
<body>

  <header class="admin-header glass-panel">
    <div style="display: flex; align-items: center; gap: 1.25rem;">
      <img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Lovely_Professional_University_logo.png" alt="LPU Logo" style="width: 60px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));">
      <div>
        <h1 class="brand-title" style="font-size: 1.8rem; margin: 0;">LPU Energy IQ</h1>
        <span style="color: var(--text-secondary); font-size: 0.9rem;">Admin Panel</span>
      </div>
    </div>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <div style="text-align: right;">
        <div style="font-size: 0.8rem; color: var(--text-secondary);">Floor Average Target</div>
        <div style="font-weight: bold; color: var(--primary);"><span id="adminFloorAvg">15</span> kWh</div>
      </div>
      <a href="index.html" class="btn" style="background: rgba(255,255,255,0.1); color: white;">Exit</a>
    </div>
  </header>

  <div class="container animate-fade-in" style="padding-top: 5rem;">
    <div class="rooms-grid" id="adminRoomsGrid">
      <!-- Rooms generated by JS -->
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <script src="js/firebase-config.js?v=6"></script>
  <script src="js/admin.js?v=6"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnergyIQ - Dashboard</title>
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/en/3/3a/Lovely_Professional_University_logo.png">
  <link rel="stylesheet" href="css/style.css?v=15">
  <link rel="stylesheet" href="css/dashboard.css?v=15">
</head>
<body>

  <!-- ALERT BANNER -->
  <div id="alertBanner" class="alert-banner">
    <div class="alert-banner-content">
      <span class="alert-icon">⚠️</span>
      <div id="alertTopText" class="alert-text">Warning: High Consumption Detected</div>
    </div>
  </div>

  <div class="container animate-fade-in" style="margin-top: 2rem;">
    <header class="dashboard-header">
      <div style="display: flex; align-items: center; gap: 1.25rem;">
        <img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Lovely_Professional_University_logo.png" alt="LPU Logo" style="width: 70px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));">
        <div>
          <h1 class="brand-title" style="font-size: 2.2rem; margin: 0;">LPU Energy IQ</h1>
          <h2 id="roomTitle" style="color: var(--text-secondary); margin-top: 0.2rem; font-size: 1.1rem;">Room ---</h2>
        </div>
      </div>
      <div>
        <button id="logoutBtn" class="btn" style="background: rgba(255,255,255,0.1); color: white;">Logout</button>
      </div>
    </header>

    <!-- NOTIFICATION TOAST (Detailed Alert) -->
    <div id="notificationToast" class="notification-toast glass-panel hide">
      <div class="toast-header">
        <span class="toast-icon">⚡</span>
        <strong>Smart Alert</strong>
        <button id="closeToast" class="toast-close">&times;</button>
      </div>
      <div class="toast-body">
        <p id="alertComparison" class="toast-comparison"></p>
        <p id="alertCause" class="toast-cause"></p>
        <p id="alertAction" class="toast-action"></p>
        <hr class="toast-divider">
        <p class="toast-notified"><small>📲 Notified: <span id="notifiedList"></span></small></p>
      </div>
    </div>

    <div class="dashboard-grid">
      <!-- Status Box -->
      <div class="glass-panel stat-box">
        <h3>Current Status</h3>
        <div id="statusIndicator" class="status-indicator status-normal">NORMAL</div>
      </div>
      <!-- Consumption Box -->
      <div class="glass-panel stat-box">
        <h3>Live Consumption</h3>
        <div class="consumption-value text-primary"><span id="totalConsumption">0.0</span> <span style="font-size: 1rem; color: var(--text-secondary)">kWh</span></div>
      </div>
      <!-- Floor average -->
      <div class="glass-panel stat-box">
        <h3>Floor Average</h3>
        <div class="consumption-value" style="color: var(--text-secondary)"><span id="floorAvg">0.0</span> <span style="font-size: 1rem;">kWh</span></div>
      </div>
      <!-- Estimated Bill -->
      <div class="glass-panel stat-box">
        <h3>Estimated Bill</h3>
        <div class="consumption-value" style="color: var(--warning)">
          <span style="font-size: 2rem;">₹</span><span id="estimatedBill">0.00</span>
        </div>
      </div>
    </div>
    
    <!-- Live Energy Chart -->
    <div class="glass-panel mt-2" style="padding: 1.5rem; margin-bottom: 2rem;">
      <h3 style="margin-bottom: 0.5rem;">Live Energy Load</h3>
      <div class="chart-container">
        <canvas id="consumptionChart"></canvas>
      </div>
    </div>

    <!-- Devices Grid -->
    <h3 class="mt-4 mb-2">Device Usage</h3>
    <div class="devices-grid" id="devicesGrid">
      <!-- Generated by JS -->
    </div>
    
    <!-- Monthly History Chart -->
    <div class="glass-panel mt-4" style="padding: 1.5rem; margin-bottom: 2rem;">
      <h3 style="margin-bottom: 0.5rem;">Monthly Consumption History (Last 30 Days)</h3>
      <div class="chart-container">
        <canvas id="monthlyChart"></canvas>
      </div>
    </div>
    
    <!-- Permanent Insight Card displayed when usage is high -->
    <div id="usageInsightCard" class="glass-panel" style="margin-top: 2rem; display: none; padding: 1.5rem; text-align: center; border-radius: 20px; transition: all 0.3s ease;">
      <h3 id="insightTitle" style="margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;"></h3>
      <p id="insightDesc" style="color: var(--text-light); line-height: 1.6;"></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script src="js/firebase-config.js?v=18"></script>
  <script src="js/dashboard.js?v=18"></script>
</body>
</html>
